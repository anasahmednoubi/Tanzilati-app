    <script>
      (function () {
        var t0 = Date.now();
        function hide() {
          var s = document.getElementById('splash');
          if (!s) return;
          s.classList.add('out');
          setTimeout(function () {
            if (s.parentNode) s.parentNode.removeChild(s);
          }, 700);
        }
        var iv = setInterval(function () {
          var r = document.getElementById('root');
          var ready = r && r.children.length > 0;
          var dt = Date.now() - t0;
          if ((dt > 1500 && ready) || dt > 7000) {
            clearInterval(iv);
            hide();
