name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Tanzeelati Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tanzeelati-Debug-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -e "console.log(require('./public/version.json').version)")
          TITLE=$(node -e "const v=require('./public/version.json'); console.log(v.title_ar || v.title)")
          NOTES=$(node -e "const v=require('./public/version.json'); const ar=(v.features_ar||v.features||[]).map(f=>'- '+f).join('\n'); const en=(v.features_en||[]).map(f=>'- '+f).join('\n'); console.log('## العربية\n'+ar+(en?'\n\n## English\n'+en:''))")
          TAG="v${VERSION}"
          cp "${{ steps.find_apk.outputs.apk_path }}" Tanzeelati-Debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Tanzeelati-Debug.apk --clobber
          else
            gh release create "$TAG" Tanzeelati-Debug.apk --title "تنزيلاتي $TAG - $TITLE" --notes "$NOTES"
          fi
