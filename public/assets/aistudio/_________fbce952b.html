<!DOCTYPE html>
<html lang="ar" dir="rtl" data-acc="green" style="--ab:#059669">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تنزيلاتي</title>
<style>
:root{--bg:#f6f4fb;--card:#fff;--text:#1d1b24;--mute:#6b6778;--line:#e3dfee;--acc:#7c3aed;--accbg:#ede4fd;--track:#e9e5f2;--ok:#0f8a5f;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16141d;--card:#201d2b;--text:#f1eff7;--mute:#a6a1b8;--line:#342f45;--acc:#8b5cf6;--accbg:#2e2447;--track:#342f45;--ok:#4ade9c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16141d;--card:#201d2b;--text:#f1eff7;--mute:#a6a1b8;--line:#342f45;--acc:#8b5cf6;--accbg:#2e2447;--track:#342f45;--ok:#4ade9c;color-scheme:dark}
:root[data-acc]{--acc:var(--ab);--accbg:color-mix(in srgb,var(--ab) 16%,var(--card))}
@media (prefers-color-scheme:dark){:root[data-acc]:not([data-theme="light"]){--acc:color-mix(in srgb,var(--ab) 78%,#fff);--accbg:color-mix(in srgb,var(--ab) 24%,var(--card))}}
:root[data-acc][data-theme="dark"]{--acc:color-mix(in srgb,var(--ab) 78%,#fff);--accbg:color-mix(in srgb,var(--ab) 24%,var(--card))}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ff,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif);line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 120px;overflow-x:hidden;zoom:var(--zs,1)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
.tt,.tt *{transition:background-color .45s,color .45s,border-color .45s!important}
.tt .logo *{transition:fill .45s,stroke .45s!important}
.hide{display:none}

.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
h1{font-size:24px;margin:0}
.sub{color:var(--mute);font-size:14px}
.lead{margin:0 0 16px}
.logo{flex:none;display:block;--lbg:var(--acc);--lfg:#fff;--lbd:#000}
.logo *{transition:fill .4s,stroke .4s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{--lbg:#000;--lfg:var(--acc);--lbd:#fff}}
:root[data-theme="dark"] .logo{--lbg:#000;--lfg:var(--acc);--lbd:#fff}
.logo .arc{animation:logoDraw 1s ease-out}
@keyframes logoDraw{from{stroke-dasharray:0 82}}
#thm{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:50%;width:42px;height:42px;padding:0;cursor:pointer;display:grid;place-items:center}
@keyframes thmIn{from{transform:rotate(-120deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
#thm.spin svg{animation:thmIn .55s cubic-bezier(.2,.8,.2,1)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label.t{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
.row{display:flex;gap:8px}
input[type=text],input[type=email],input[type=password]{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--line);
  border-radius:999px;padding:10px 16px;direction:ltr;text-align:left;transition:border-color .25s,box-shadow .25s}
input[type=text]:focus,input[type=email]:focus,input[type=password]:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
button{font:inherit;border:0;border-radius:999px;padding:10px 16px;background:var(--acc);color:#fff;cursor:pointer;
  transition:transform .15s,opacity .2s,background-color .25s}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.55;cursor:default}
button.ghost{background:var(--track);color:var(--text)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.reveal{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}
.reveal.open{grid-template-rows:1fr}
.reveal>div{overflow:hidden;min-height:0}
.prev{display:flex;gap:12px;align-items:center;padding-top:14px;opacity:0;transform:translateY(6px);transition:opacity .4s .1s,transform .4s .1s}
.open .prev{opacity:1;transform:none}
.thumb{width:112px;height:63px;flex:none;border-radius:12px;position:relative;background:linear-gradient(135deg,#0b3b2c,var(--acc))}
.thumb::after{content:"";position:absolute;top:50%;inset-inline-start:46px;margin-top:-9px;
  border-block:9px solid transparent;border-inline-start:15px solid #fff;opacity:.92}
.pm b{display:block;font-weight:600;line-height:1.35}
.pm span{color:var(--mute);font-size:14px}

.mt{display:flex;gap:6px;margin-bottom:12px;background:var(--track);padding:4px;border-radius:999px;position:relative}
.mt button{flex:1;background:transparent;color:var(--text);padding:9px 6px;font-size:15px;position:relative;z-index:1;transition:color .3s,transform .15s}
.mt button.on{color:#fff}
.pill{position:absolute;top:4px;bottom:4px;width:calc(50% - 7px);inset-inline-start:4px;background:var(--acc);border-radius:999px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.mt[data-m="audio"] .pill{transform:translateX(calc(-100% - 6px))}

.dd{background:var(--bg);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.dd.open{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:transparent;color:var(--text);border-radius:0;padding:13px 16px;text-align:start}
.dd-btn svg{flex:none;color:var(--mute);transition:transform .3s}
.dd.open .dd-btn svg{transform:rotate(180deg)}
.dd-list{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.dd.open .dd-list{grid-template-rows:1fr}
.dd-list>ul{overflow:hidden;min-height:0;list-style:none;margin:0;padding:0;visibility:hidden;border-top:1px solid var(--line);transition:visibility 0s .35s}
.dd.open .dd-list>ul{visibility:visible;transition-delay:0s}
.dd-list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;cursor:pointer;font-size:15px;transition:background-color .2s}
.dd-list li:hover{background:var(--accbg)}
.dd-list li svg{flex:none;color:var(--acc);opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.dd-list li[aria-selected="true"]{font-weight:600}
.dd-list li[aria-selected="true"] svg{opacity:1;transform:none}
.dd-btn:focus-visible,.dd-list li:focus-visible{outline-offset:-3px}
.hint{color:var(--mute);font-size:14px;margin:8px 0 0}
.dir{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
.dir code{direction:ltr;unicode-bidi:embed}
.dir button{padding:6px 12px;font-size:14px}

.go{width:100%;padding:14px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.bar{height:20px;background:var(--track);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.fill{height:100%;width:0;background:var(--acc);border-radius:99px;position:relative;transition:width .2s linear}
.fill::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity .6s;
  background:linear-gradient(100deg,transparent 0,rgba(255,255,255,.28) 25%,transparent 50%,rgba(255,255,255,.16) 75%,transparent 100%);background-size:200% 100%}
.fill.run::after{opacity:1;animation:wf 1.6s linear infinite}
@keyframes wf{from{background-position:0 0}to{background-position:200% 0}}
.top{display:flex;justify-content:space-between;align-items:baseline}
.top b{font-size:22px;font-variant-numeric:tabular-nums}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.result{background:var(--accbg);border-radius:12px;padding:12px;margin-top:12px;font-weight:600;text-align:center;display:none}
.result.show{display:block;animation:pop .4s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

.q{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.q:first-of-type{border-top:0}
.q .n{display:flex;align-items:center;gap:10px;min-width:0}
.q .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accbg);color:var(--acc);display:grid;place-items:center}
.q .s{color:var(--ok);font-weight:600;flex:none;font-size:14px}
.q.new{animation:pop .45s cubic-bezier(.2,.8,.2,1)}
.empty{color:var(--mute);text-align:center;padding:30px 0}
.note{color:var(--mute);font-size:13px;text-align:center;margin:16px 0 0}

/* floating bottom bar (same spec as إنجازاتي) */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;
  padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#dock>*{pointer-events:auto}
#nav{flex:1;display:flex;gap:4px;padding:5px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#nav button{flex:1;background:var(--track);color:var(--text);padding:10px 6px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;transition:flex .3s ease,background-color .25s,color .25s,transform .15s}
#nav button.on{background:var(--acc);color:#fff;flex:2.4}
#nav .tn{display:none;white-space:nowrap}
#nav button.on .tn{display:inline}
#tH{flex:none;width:54px;height:54px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--text);
  border:1.5px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.2);transition:background-color .3s,color .3s,transform .2s}
#tH.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#tH:active,#nav button:active{transform:scale(.94)}
@keyframes inL{from{opacity:0;transform:translate3d(-22px,0,0)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translate3d(22px,0,0)}to{opacity:1;transform:none}}
.in-l{animation:inL .35s ease-out}
.in-r{animation:inR .35s ease-out}

/* settings (More) page */
.srow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:12px 14px;border-radius:14px;transition:transform .15s,background-color .2s}
.srow:active{transform:scale(.97)}
.srow .l{display:flex;align-items:center;gap:10px}
.srow .v{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:14px}
.back{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.back button{background:var(--card);color:var(--text);border:1px solid var(--line);padding:8px 10px}
.back b{font-size:18px}
.chips{display:flex;gap:6px}
.chip{flex:1;background:var(--track);color:var(--text);padding:7px 14px;font-size:14px}
.chip.on{background:var(--acc);color:#fff}
.sw{display:flex;gap:14px;padding:6px 4px 2px;flex-wrap:wrap}
.dot{width:30px;height:30px;padding:0;background:var(--c);border-radius:50%;transition:transform .2s,box-shadow .25s}
.dot:hover{transform:scale(1.12)}
.dot[aria-checked="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}
.danger{color:#d33}
.or{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--mute);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{background:none;color:var(--mute);width:100%;margin-top:6px;font-size:14px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.fdd{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--bg);color:var(--text);border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;font-size:16px}
.fdd svg{flex:none;color:var(--mute);transition:transform .3s}
.fdd[aria-expanded="true"] svg{transform:rotate(180deg)}
.fpanel{margin-top:6px;max-height:300px;overflow-y:auto;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);padding:4px;animation:pop .3s cubic-bezier(.2,.8,.2,1)}
.fi{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:transparent;color:var(--text);border-radius:10px;padding:10px 12px;font-size:18px;text-align:start}
.fi.on{background:var(--accbg);color:var(--acc)}
.fg{padding:8px 12px 4px;font-size:12px;color:var(--mute)}
.badge{display:inline-grid;place-items:center;border-radius:50%;font-weight:800;border:1px solid var(--line);flex:none;font-family:system-ui,sans-serif}
.av{width:54px;height:54px;border-radius:50%;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex:none}
.sync{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.nbn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;margin:0 auto;max-width:420px;z-index:300;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--card);color:var(--text);border:1.5px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none;animation:nbn 3.5s ease forwards}
.nbn .ni{width:34px;height:34px;border-radius:50%;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.nbn b{display:block;font-size:14px}
.nbn .t{font-size:13px;color:var(--mute)}
@keyframes nbn{0%{opacity:0;transform:translateY(-20px)}8%{opacity:1;transform:none}88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-20px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="hd">
    <div class="brand">
      <svg class="logo" width="40" height="40" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="2" y="2" width="44" height="44" rx="13" fill="var(--lbg)" stroke="var(--lbd)" stroke-width="1.2"/>
        <circle cx="24" cy="25" r="13" fill="none" stroke="var(--lfg)" stroke-opacity=".28" stroke-width="4"/>
        <circle class="arc" cx="24" cy="25" r="13" fill="none" stroke="var(--lfg)" stroke-width="4" stroke-linecap="round" stroke-dasharray="61 82" transform="rotate(-90 24 25)"/>
        <path d="M24 18v11M19.5 25l4.5 4.5 4.5-4.5" fill="none" stroke="var(--lfg)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>تنزيلاتي</h1>
    </div>
    <button id="thm" aria-label="تبديل الوضع الليلي"></button>
  </div>
  <p class="sub lead">الصق الرابط، اختر الجودة، وحمّل.</p>

  <!-- tab: download -->
  <div id="pD">
    <section class="card">
      <label class="t" for="url">رابط الفيديو</label>
      <div class="row">
        <input type="text" id="url" placeholder="https://" inputmode="url" autocomplete="off">
        <button id="fetch">جلب</button>
      </div>
      <div class="reveal" id="rv"><div>
        <div class="prev">
          <div class="thumb" aria-hidden="true"></div>
          <div class="pm"><b>شرح أساسيات البرمجة للمبتدئين</b><span>قناة تجريبية · 12:48</span></div>
        </div>
      </div></div>
    </section>

    <section class="card">
      <div class="mt" id="mt" data-m="video" role="tablist">
        <span class="pill"></span>
        <button class="on" data-m="video" role="tab">فيديو</button>
        <button data-m="audio" role="tab">صوت فقط</button>
      </div>
      <label class="t" id="qLbl">الجودة</label>
      <div class="dd" id="dd">
        <button class="dd-btn" id="ddBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="qLbl ddVal">
          <span id="ddVal"></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="dd-list"><ul id="ddList" role="listbox" aria-labelledby="qLbl"></ul></div>
      </div>
      <p class="hint" id="hint"></p>
      <div class="dir"><span>الحفظ في <code>~/Downloads</code></span><button class="ghost" type="button">تغيير</button></div>
    </section>

    <button class="go" id="go">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
      <span id="goT">تحميل</span>
    </button>

    <section class="card" aria-live="polite">
      <div class="top"><span id="state">جاهز للتحميل</span><b id="pct">0%</b></div>
      <div class="bar"><div class="fill" id="bar"></div></div>
      <div class="meta"><span id="speed">السرعة: —</span><span id="eta">المتبقي: —</span></div>
      <div class="result" id="res"></div>
    </section>
  </div>

  <!-- tab: history -->
  <div id="pS" class="hide"></div>
  <!-- tab: settings (More) -->
  <div id="pH" class="hide"></div>

  <p class="note">نسخة لعرض الشكل فقط، والتقدم فيها محاكاة.</p>
</main>

<div id="dock">
  <div id="nav" role="tablist">
    <button id="tD" class="on" aria-label="تحميل" role="tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span class="tn">تحميل</span>
    </button>
    <button id="tS" aria-label="السجل" role="tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span class="tn">السجل</span>
    </button>
  </div>
  <button id="tH" aria-label="المزيد">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
  </button>
</div>

<script>
const $ = id => document.getElementById(id);
const root = document.documentElement;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- theme ---------- */
const SUN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
const isDark = () => (root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
const paintThm = spin => { $("thm").innerHTML = isDark() ? SUN : MOON; if (spin) { $("thm").classList.remove("spin"); void $("thm").offsetWidth; $("thm").classList.add("spin"); } };
paintThm(false);
function softSwap(fn) { root.classList.add("tt"); fn(); setTimeout(() => root.classList.remove("tt"), 550); }
function swapTheme(fn, el) {
  if (reduce) { fn(); return; }
  if (document.startViewTransition) {
    const r = el.getBoundingClientRect();
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    const t = document.startViewTransition(fn);
    t.ready.then(() => {
      root.animate(
        { clipPath: ["circle(0px at " + x + "px " + y + "px)", "circle(" + rad + "px at " + x + "px " + y + "px)"] },
        { duration: 700, easing: "cubic-bezier(.4,0,.2,1)", pseudoElement: "::view-transition-new(root)" }
      );
    }).catch(() => {});
  } else softSwap(fn);
}
function setTheme(v, el) {
  swapTheme(() => { if (v === "auto") delete root.dataset.theme; else root.dataset.theme = v; paintThm(true); renderH(); }, el);
}
$("thm").onclick = e => setTheme(isDark() ? "light" : "dark", $("thm"));

    pH.innerHTML =
      '<div class="card"><div style="display:flex;align-items:center;gap:12px"><div class="av">' + (n ? esc(Array.from(n)[0]) : ico(ICONS.user)) + '</div><div style="flex:1;min-width:0">' +
      (n ? '<div style="font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">أهلاً، <span style="color:var(--acc)" dir="auto">' + esc(n) + "</span></div>" : "") +
      '<div class="sub" style="overflow-wrap:anywhere">الحساب' + (isLinked() ? ': <span dir="auto" style="color:var(--text)">' + esc(LNK.g) + "</span>" : "") + '</div></div></div><div class="sub" style="margin-top:10px">' + hist.length + " ملف — " + (isLinked() ? "سجلّك محفوظ على جهازك وعلى حسابك." : "بياناتك محفوظة على جهازك فقط.") + "</div></div>" +
      '<div class="card"><b>الإعدادات</b>' +
      srow("font", "font", "الخط", esc(fnt.f || "الافتراضي")) +
      srow("theme", "theme", "المظهر", TH_L[th]) +
      srow("dl", "dl", "التحميل", defMode === "audio" ? "صوت فقط" : "فيديو") +
      srow("link", "link", "ربط", isLinked() ? '<span style="color:var(--ok)">مرتبط</span>' : "") +
      '<div style="margin-top:14px"><button class="ghost danger" id="wipe" style="width:100%">' + (wipeArm ? "اضغط مرة أخرى للتأكيد" : "مسح سجل التحميلات") + "</button></div></div>" +
      '<div class="card"><b>عن التطبيق</b><div class="sub" style="margin-top:8px">تنزيلاتي — أداة بسيطة لتحميل الفيديوهات أو استخراج الصوت منها.</div><div class="sub" style="margin-top:4px">الإصدار 1.0</div></div>';
  }
  if (keepId && $(keepId)) $(keepId).focus();
}
$("pH").addEventListener("input", e => { const f = e.target.dataset && e.target.dataset.f; if (f) AUTH[f] = e.target.value; });
$("pH").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.sub) { hSub = d.sub; fOpen = false; sOpen = false; AUTH.err = ""; AUTH.info = ""; renderH(); }
  else if ("back" in d) { hSub = null; fOpen = false; sOpen = false; renderH(); }
  else if ("fopen" in d) { fOpen = !fOpen; if (fOpen) { sOpen = false; FG.forEach(g => g[1].forEach(loadFont)); } renderH(); }
  else if ("sopen" in d) { sOpen = !sOpen; if (sOpen) fOpen = false; renderH(); }
  else if ("fnt" in d) setFnt("f", d.fnt);
  else if (d.fs) setFnt("s", d.fs);
  else if (d.thm) setTheme(d.thm, t);
  else if (d.acc) setAcc(d.acc);
  else if (d.dm) { defMode = d.dm; setMode(defMode); renderH(); }
  else if (d.amode) { AUTH.mode = d.amode; AUTH.err = ""; AUTH.info = ""; renderH(); }
  else if ("asubmit" in d) aSubmit();
  else if ("reset" in d) aReset();
  else if ("google" in d) aGoogle();
  else if ("unlink" in d) unLink();
  else if ("sync" in d) cloudSync().then(ok => toast("المزامنة", ok ? "تمت مزامنة البيانات" : "المزامنة غير متاحة الآن"));
  else if (t.id === "wipe") {
    if (!wipeArm) { wipeArm = true; renderH(); setTimeout(() => { wipeArm = false; if (!hSub) renderH(); }, 3000); }
    else { wipeArm = false; hist = []; renderS(); cloudPush(); renderH(); }
  }
});
$("pH").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.f) { e.preventDefault(); aSubmit(); } });
renderH();
cloudInit();

/* ---------- tabs ---------- */
const TABS = ["D", "S", "H"];
let curTab = "D";
function tab(n) {
  const same = n === curTab;
  const dirc = TABS.indexOf(n) > TABS.indexOf(curTab) ? "in-l" : "in-r";
  curTab = n;
  TABS.forEach(x => {
    const p = $("p" + x);
    p.classList.remove("in-l", "in-r");
    p.classList.toggle("hide", x !== n);
    $("t" + x).classList.toggle("on", x === n);
    $("t" + x).setAttribute("aria-selected", x === n);
  });
  if (n === "H" && !same) { hSub = null; renderH(); }
  if (!same) $("p" + n).classList.add(dirc);
  window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
}
TABS.forEach(x => $("t" + x).onclick = () => tab(x));
</script>
